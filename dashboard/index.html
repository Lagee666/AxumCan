<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Signal Dashboard</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="app" class="container mx-auto p-8">
        <header class="mb-8 flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <div>
                    <h1 class="text-3xl font-bold">CAN Simulator</h1>
                    <p id="status" class="text-red-500">Disconnected</p>
                </div>
                <nav class="flex space-x-2 bg-gray-800 p-1 rounded-lg border border-gray-700">
                    <button id="nav-controls" class="px-4 py-2 rounded-md bg-blue-600 text-white font-medium transition-colors">Controls</button>
                    <button id="nav-monitor" class="px-4 py-2 rounded-md hover:bg-gray-700 text-gray-300 font-medium transition-colors">Monitor</button>
                </nav>
            </div>
            <div id="global-toggle-container" class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex items-center space-x-3">
                <span class="text-sm font-semibold">Global Backend Control</span>
                <input type="checkbox" checked id="global-toggle" class="w-5 h-5 text-blue-600 bg-gray-700 border-gray-600 rounded">
            </div>
        </header>

        <main id="view-controls" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamic signals will be injected here -->
            <div class="text-gray-500 italic">Waiting for signals...</div>
        </main>

        <main id="view-monitor" class="hidden">
            <div class="bg-gray-800 rounded-lg border border-gray-700 shadow-xl overflow-hidden">
                <div class="p-4 border-b border-gray-700 bg-gray-900 flex justify-between items-center">
                    <h2 class="text-xl font-bold">Real-Time Signal Monitor</h2>
                    <button id="clear-monitor" class="text-xs bg-red-900/50 hover:bg-red-900 text-red-200 px-3 py-1 rounded border border-red-700 transition-colors">Clear Log</button>
                </div>
                <div id="monitor-log" class="p-4 font-mono text-sm h-[600px] overflow-y-auto space-y-1 bg-black/50">
                    <div class="text-gray-500 italic">Listening for updates...</div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
